services:
  app:
    image: node:24
    container_name: resume-L1

    stdin_open: true
    tty: true

    env_file:
      - .env

    ports:
      - 3005:3000

    volumes:
      - ./src/L1/resume:/home
      - resume_node_modules:/home/node_modules

    working_dir: /home

    command: sh -c "if [ ! -x node_modules/.bin/next ]; then npm install; fi; npm run dev -- -H 0.0.0.0"

volumes:
  resume_node_modules: